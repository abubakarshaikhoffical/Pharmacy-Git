<!DOCTYPE html>
<html lang="en">
<head>

   <h1>Welcome To Stocks</h1>
<input type="text" id="searchInput" placeholder="Search by Invoice No or Name">

            <th>Invoice No.</th>
            <th>Name</th>
            <th>Quantity</th>
            <th>Purchasing Price</th>
            <th>Selling Price</th>
        </tr>
    </thead>
    <tbody id="tableBody"></tbody>
</table>
