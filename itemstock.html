<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        input{
            font-size: 2rem;
            margin-left: 1vw;
            font-family: 'Courier New', Courier, monospace;
        }
        button{
            font-size: 2rem;
            font-family: 'Courier New', Courier, monospace;
            margin-left: 1vw;
        }
        table {
            border-collapse: collapse;
            width: 90%;
            margin-top: 20px;
            font-family: 'Courier New', Courier, monospace;
        }
        th, td {
            border: 1px solid #333;
            padding: 10px 15px;
            text-align: left;
        }
        th {
            background-color: #4A90E2;
            color: white;
        }
        #searchInput{
            margin-right: 100vw;
            margin-bottom: 1vh;
        }
    </style>
</head>
<body>
    <h1>Welcome To Stocks</h1>
    <input type="text" id="searchInput" placeholder="Search by Invoice No or Name">
    <input type="text" placeholder="Enter Name" id="input1">
    <input type="number" placeholder="Enter Quantity" id="input2">
    <input type="number" placeholder="Purchasing Price" id="input3">
    <input type="number" placeholder="Selling Price" id="input4">
    <button id="addBtn">Add</button>

    <table id="stockTable">
        <thead>
            <tr>
                <th>Invoice No.</th>
                <th>Name</th>
                <th>Quantity</th>
                <th>Purchasing Price</th>
                <th>Selling Price</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            <!-- rows get added here -->
        </tbody>
    </table>

    <script src="itemstock.js"></script>
</body>
</html>
